[pytest]
# Default run = offline unit tests only. Opt into other layers explicitly:
#   pytest -m unit                       # fast, no creds (the default below)
#   RUN_INTEGRATION=1 pytest -m integration
#   RUN_E2E=1 API_URL=... pytest -m e2e
addopts = -q -m unit
testpaths = tests
# Put the project root on sys.path so `import src.*` works for bare `pytest` too
# (not only `python -m pytest`, which adds the cwd implicitly).
pythonpath = .
markers =
    unit: fast offline tests, no external services or credentials
    integration: hit real backends (Mongo/Azure); gated by RUN_INTEGRATION=1
    e2e: run against a live API; gated by RUN_E2E=1 and API_URL
    smoke: post-deploy smoke checks
